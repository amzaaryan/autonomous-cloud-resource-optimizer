global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # The optimizer adds/removes target-service replicas at runtime, each with the network alias
  # `target-service`. DNS service discovery re-resolves that name and scrapes EVERY replica, so
  # `count(up{job="target-service"} == 1)` is the live replica count.
  - job_name: target-service
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["target-service"]
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: optimizer
    metrics_path: /metrics
    static_configs:
      - targets: ["optimizer:8001"]
