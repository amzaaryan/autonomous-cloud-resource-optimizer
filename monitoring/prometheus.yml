global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: target-service
    metrics_path: /metrics
    static_configs:
      - targets: ["target-service:8000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: optimizer
    metrics_path: /metrics
    static_configs:
      - targets: ["optimizer:8001"]
