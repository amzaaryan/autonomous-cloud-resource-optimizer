# Round-robin load balancer in front of every target-service replica.
#
# Replicas are created and removed at runtime by the optimizer (Docker SDK), and each one
# carries the network alias `target-service`, so Docker's embedded DNS (127.0.0.11) returns
# one A record per live replica. Because proxy_pass uses a VARIABLE, nginx resolves the name
# at request time (re-checking every `valid` seconds) instead of once at startup, and spreads
# requests across all returned addresses.
events {}

http {
    resolver 127.0.0.11 valid=2s ipv6=off;
    access_log off;

    server {
        listen 80;

        location = /lb-health {
            return 200 "ok\n";
        }

        location / {
            set $upstream http://target-service:8000;
            proxy_pass $upstream;

            # A brand-new replica can be resolvable a moment before it accepts connections,
            # and a draining one may refuse them: retry the next address instead of failing.
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }
    }
}
